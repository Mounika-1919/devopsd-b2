
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-docker-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-docker-app
  template:
    metadata:
      labels:
        app: kubernetes-docker-app
    spec:
      containers:
        - name: kubernetes-docker-container
          image: ymounika1919/kubernetes-docker-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
